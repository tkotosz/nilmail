name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Run by hand from the Actions page, for example to apply changed Cloudflare variables.
  workflow_dispatch:
    inputs:
      target:
        description: 'preview: deploy main to the preview address. production: deploy the latest release again.'
        type: choice
        options: [preview, production]
        default: preview
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.target != 'production' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/ci.yml

  # A manual production deploy uploads the latest release again, never unreleased commits on main. That release passed
  # its checks when it was published.
  latest-release:
    name: Find the latest release
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.latest.outputs.sha }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName); then
            echo '::error::There is no release yet. Publish one first; it deploys production by itself.'
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          echo "Deploying $tag ($sha) to production again."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to Cloudflare Pages
    needs: [check, latest-release]
    if: >-
      !cancelled() && (needs.check.result == 'success' || needs.latest-release.result == 'success' || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-${{ (github.event_name == 'release' || inputs.target == 'production') && 'production' || 'preview' }}
      cancel-in-progress: false
    environment:
      name: ${{ (github.event_name == 'release' || inputs.target == 'production') && 'production' || 'preview' }}
      url: ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}
    env:
      # The Pages project, and so the address <project>.pages.dev; set the PAGES_PROJECT repository variable to change it.
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'nilmail' }}
      PAGES_BRANCH: ${{ (github.event_name == 'release' || inputs.target == 'production') && 'main' || 'preview' }}
      DEPLOY_SHA: ${{ needs.latest-release.outputs.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify Cloudflare Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN under GitHub Actions secrets.'
            exit 1
          fi
          if ! production_branch=$(curl --silent --show-error --fail --max-time 15 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" |
            jq -er '.result.production_branch'); then
            echo "::error::Could not read the Pages project $PAGES_PROJECT. Check the PAGES_PROJECT variable, the account ID and the Pages token permissions."
            exit 1
          fi
          if [[ "$production_branch" != main ]]; then
            echo '::error::Set the Pages production branch to main before deploying.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: pages
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.2'
          command: >-
            pages deploy pages-dist --project-name=${{ env.PAGES_PROJECT }}
            --branch=${{ env.PAGES_BRANCH }} --commit-hash=${{ env.DEPLOY_SHA }}
